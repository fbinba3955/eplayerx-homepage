name: Refresh blocks

# Refresh cadence is folder-based, decided by the admin when placing a script:
#   scripts/blocks/daily/    -> every day
#   scripts/blocks/weekly/   -> every Sunday
#   scripts/blocks/monthly/  -> 1st of each month
#   scripts/blocks/manual/   -> only via workflow_dispatch
#   Flymby managed snapshots -> scheduled below by source refresh frequency
on:
  schedule:
    - cron: "0 21 * * 6" # 每周日 05:00（北京时间）
    - cron: "0 22 1 * *" # 每月 1 日 06:00（北京时间）
  workflow_dispatch:
    inputs:
      target:
        description: "daily | weekly | monthly | manual | single script path (e.g. weekly/bahamut-quarterly.ts)"
        required: true
        default: "manual"

concurrency:
  group: blocks-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PUBLIC_TMDB_API_BASE_URL: ${{ vars.PUBLIC_TMDB_API_BASE_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_CUSTOM_DOMAIN: ${{ vars.R2_CUSTOM_DOMAIN }}
      BLOCKS_ADMIN_PASSWORD: ${{ secrets.BLOCKS_ADMIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run block scripts
        # 原仓库脚本依赖单独的 R2 密钥；Fork 不继承这些密钥，保留手动入口，
        # 避免它在定时任务中提前失败而阻断 Flymby 托管榜单刷新。
        if: github.event_name == 'workflow_dispatch'
        run: |
          case "${{ github.event_name }}/${{ github.event.schedule }}" in
            workflow_dispatch/*) target="${{ github.event.inputs.target }}" ;;
            *) exit 0 ;;
          esac
          echo "Target: $target"

          if [[ "$target" == *.ts ]]; then
            bun run "scripts/blocks/$target"
            exit $?
          fi

          shopt -s nullglob
          failed=0
          for f in "scripts/blocks/$target"/*.ts; do
            name="$(basename "$f")"
            [ "$name" = "_template.ts" ] && continue
            echo "▶ $f"
            bun run "$f" || { echo "::warning::$f failed"; failed=1; }
          done
          exit $failed

      # Flymby 后台展示的部分榜单由统一生成器维护：它通过 Worker 写入
      # R2/D1，单个来源失败时保留上一份快照，不影响同批其他榜单刷新。
      - name: Refresh Flymby managed snapshots
        if: github.event_name == 'schedule'
        env:
          FLYHUB_BLOCKS_API_BASE_URL: https://flyhub-blocks.yaii.workers.dev
          FLYHUB_BLOCKS_PUBLISH_TOKEN: ${{ secrets.BLOCKS_PUBLISH_TOKEN }}
        run: |
          case "${{ github.event.schedule }}" in
            "0 21 * * 6")
              ids="collection-mal-weekdays,collection-guoman-weekdays,collection-mal-rankings"
              ;;
            "0 22 1 * *")
              ids="community-douban-popular-anime-doulist,community-douban-top-animation-movies,community-douban-healing-anime,community-douban-cn-animation-movies,community-tspdt-1000,community-rolling-stone-100-tv,community-wga-101-best-written-tv"
              ;;
            *)
              exit 0
              ;;
          esac
          echo "Refresh Flymby managed snapshots: $ids"
          FLYHUB_BLOCKS_BATCH_IDS="$ids" bun run scripts/blocks/manual/create-flymby-first-batch-charts.ts

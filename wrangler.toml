#:schema node_modules/wrangler/config-schema.json

name = "flyhub-blocks"
main = "src/worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# Keep the default *.workers.dev address alive.
workers_dev = true

[placement]
mode = "smart"

[observability]
enabled = true

# FlyHub Blocks database (community submissions + published blocks).
[[d1_databases]]
binding = "DB"
database_name = "flyhub-blocks"
database_id = "95c87b62-3fdc-4bd3-855c-fe7d2554f577"
migrations_dir = "migrations"

# FlyHub Blocks snapshots and collection assets.
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "flyhub-blocks"

# Uncomment to enable cron trigger (e.g. daily crawl at 08:00 UTC)
# [triggers]
# crons = ["0 8 * * *"]

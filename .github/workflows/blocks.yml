name: Refresh blocks

# Refresh cadence is folder-based, decided by the admin when placing a script:
#   scripts/blocks/daily/    -> manual only
#   scripts/blocks/weekly/   -> manual only
#   scripts/blocks/monthly/  -> manual only
#   scripts/blocks/manual/   -> only via workflow_dispatch
#   Flymby managed snapshots -> every two hours refresh all managed snapshots
on:
  schedule:
    - cron: "17 */2 * * *" # 每两小时的第 17 分钟，避开整点调度拥堵
  workflow_dispatch:
    inputs:
      target:
        description: "选择手动执行范围"
        required: true
        default: "manual"
        type: choice
        options:
          - manual
          - daily
          - weekly
          - monthly
          - weekly_and_monthly
          - daily_weekly_monthly

concurrency:
  group: blocks-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PUBLIC_TMDB_API_BASE_URL: ${{ vars.PUBLIC_TMDB_API_BASE_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_CUSTOM_DOMAIN: ${{ vars.R2_CUSTOM_DOMAIN }}
      BLOCKS_ADMIN_PASSWORD: ${{ secrets.BLOCKS_ADMIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run block scripts
        # 原仓库脚本依赖单独的 R2 密钥；Fork 不继承这些密钥，保留手动入口，
        # 避免它在定时任务中提前失败而阻断 Flymby 托管榜单刷新。
        if: github.event_name == 'workflow_dispatch'
        run: |
          case "${{ github.event_name }}/${{ github.event.schedule }}" in
            workflow_dispatch/*) target="${{ github.event.inputs.target }}" ;;
            *) exit 0 ;;
          esac
          # Flymby 托管榜单由后续专用发布步骤处理，避免普通手动脚本重复抓取。
          if [[ "$target" != "manual" ]]; then
            exit 0
          fi
          echo "Target: $target"

          if [[ "$target" == *.ts ]]; then
            bun run "scripts/blocks/$target"
            exit $?
          fi

          shopt -s nullglob
          failed=0
          for f in "scripts/blocks/$target"/*.ts; do
            name="$(basename "$f")"
            [ "$name" = "_template.ts" ] && continue
            [ "$name" = "create-flymby-first-batch-charts.ts" ] && continue
            echo "▶ $f"
            bun run "$f" || { echo "::warning::$f failed"; failed=1; }
          done
          exit $failed

      # Flymby 后台展示的部分榜单由统一生成器维护：它通过 Worker 写入
      # R2/D1，单个来源失败时保留上一份快照，不影响同批其他榜单刷新。
      - name: Refresh Flymby managed snapshots
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.target != 'manual')
        env:
          # 关键变量：使用已绑定资源的自定义域名，避免依赖 workers.dev 域名解析。
          FLYHUB_BLOCKS_API_BASE_URL: https://bangdan.190147.xyz
          FLYHUB_BLOCKS_PUBLISH_TOKEN: ${{ secrets.BLOCKS_PUBLISH_TOKEN }}
        run: |
          daily_ids="flymby-test-tmdb-popular-movies,flymby-test-tmdb-popular-tv,flymby-test-tmdb-top-animation,community-douban-weekly-best-movies,community-douban-global-best-tv,community-douban-chinese-best-tv,community-endata-hot-movie,community-endata-hot-tv,community-endata-hot-anime,community-guduo-network-drama,community-iqiyi-hot-tv,community-justwatch-streaming-charts,community-imdb-popular-movies,community-imdb-popular-tv,community-rt-popular-tv,community-douban-hot-domestic-tv,community-douban-hot-hong-kong-tv,community-douban-hot-taiwan-tv,community-douban-hot-korean-tv,community-douban-hot-japanese-tv,community-douban-hot-thai-tv,community-douban-hot-american-tv,community-douban-hot-animation,community-douban-hot-variety-shows,community-anilist-trending,community-bangumi-calendar"
          weekly_ids="community-anichart-seasonal,collection-anime-calendar,collection-bahamut-weekdays,collection-mal-weekdays,collection-guoman-weekdays,collection-mal-rankings,community-zh-studio-20th-century,community-zh-studio-a24,community-zh-studio-amblin,community-zh-studio-columbia,community-zh-studio-dc,community-zh-studio-dreamworks,community-zh-studio-legendary,community-zh-studio-lionsgate,community-zh-studio-lucasfilm,community-zh-studio-mgm,community-zh-studio-millennium,community-zh-studio-miramax,community-zh-studio-newline,community-zh-studio-orion,community-zh-studio-paramount,community-zh-studio-pixar,community-zh-studio-sony,community-zh-studio-universal,community-zh-studio-disney,community-zh-studio-warner,community-zh-netflix,community-zh-disney-plus,community-zh-hbo,community-zh-apple-tv-plus,community-zh-prime-video,community-douban-chinese-best-variety,community-douban-global-best-variety"
          monthly_ids="community-douban-top250,community-imdb-top250-movies,community-imdb-top250-tv,community-maoyan-top100,community-bfi-sight-sound-100,community-letterboxd-oscar-best-picture,community-letterboxd-palme-dor,community-letterboxd-top100-docuseries,community-mal-top-anime,community-mal-most-popular,community-bangumi-top-anime,community-iqiyi-lianlian-theater,community-iqiyi-mist-theater,community-iqiyi-xiaodou-theater,community-tencent-x-theater,community-youku-baiye-theater,community-youku-shenghua-theater,community-douban-popular-anime-doulist,community-douban-top-animation-movies,community-douban-healing-anime,community-douban-cn-animation-movies,community-tspdt-1000,community-rolling-stone-100-tv,community-wga-101-best-written-tv"
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            # 定时任务始终刷新全部 Flymby 托管榜单，确保不同原始刷新频率的榜单也能及时更新。
            ids="$daily_ids,$weekly_ids,$monthly_ids"
          else
            case "${{ github.event.inputs.target }}" in
              daily)
                ids="$daily_ids"
                ;;
              weekly)
                ids="$weekly_ids"
                ;;
              monthly)
                ids="$monthly_ids"
                ;;
              weekly_and_monthly)
                ids="$weekly_ids,$monthly_ids"
                ;;
              daily_weekly_monthly)
                ids="$daily_ids,$weekly_ids,$monthly_ids"
                ;;
              *)
                exit 0
                ;;
            esac
          fi
          echo "Refresh Flymby managed snapshots: $ids"
          FLYHUB_BLOCKS_BATCH_IDS="$ids" bun run scripts/blocks/manual/create-flymby-first-batch-charts.ts
